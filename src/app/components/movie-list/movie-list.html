<div class ="container">
    @for (movie of movieService.movieList(); track movie.id){
        <div class="movie-card" (click)="navigateTo(movie)">
            <div class="movie-poster">
                <img [src]="`https://image.tmdb.org/t/p/w500/${movie.poster_path}`" alt="">
            </div>
            <div class="movie-detail">
                <h2>
                    {{movie.title}}
                </h2>
            </div>
        </div>
    }
</div>
